<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Premium Thai Digits Collector{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="layout">
        <!-- เมนูด้านซ้าย (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Thai Digits ML</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">
                    <i class="fas fa-file-signature" style="width: 20px; text-align: center; margin-right: 8px;"></i> หน้าสำหรับผู้ใช้
                </a>
                <a href="{{ url_for('admin') }}" class="{% if request.endpoint == 'admin' %}active{% endif %}">
                    <i class="fas fa-cog" style="width: 20px; text-align: center; margin-right: 8px;"></i> หน้าสำหรับแอดมิน
                </a>
            </nav>
        </aside>

        <!-- เนื้อหาหลัก (Main Content) -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
