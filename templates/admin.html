{% extends 'base.html' %}

{% block title %}หน้าสำหรับแอดมิน - Thai Digits ML{% endblock %}

{% block content %}
<div class="container">
    <h2>การจัดการระบบ (Admin)</h2>
    <p class="subtitle">อัปเดตไฟล์โมเดล AI (.joblib) โดยไม่ต้องเริ่มระบบใหม่</p>
    
    <!-- ส่วนแสดงข้อมูลโมเดลปัจจุบัน -->
    <div style="padding: 20px; background: white; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--primary-gold);">
        <h3><i class="fas fa-microchip" style="color: var(--primary-gold); margin-right: 8px;"></i> ข้อมูลโมเดลปัจจุบัน (Model Internals)</h3>
        <div id="model-info-content" style="margin-top: 15px;">
            <p style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- ส่วนฟอร์มอัปโหลด -->
    <div style="padding: 20px; background: var(--accent-cream); border-radius: 12px; margin-top: 20px;">
        <h3><i class="fas fa-cloud-upload-alt" style="color: var(--primary-gold); margin-right: 8px;"></i> อัปโหลดโมเดลใหม่</h3>
        <form id="upload-form" style="margin-top: 20px;">
            <!-- ปรับแต่งช่องเลือกไฟล์ให้ดูดีขึ้น -->
            <label for="model-file" style="display: block; padding: 30px; border: 2px dashed var(--primary-gold); border-radius: 8px; text-align: center; cursor: pointer; background: white; transition: all 0.2s ease;" onmouseover="this.style.backgroundColor='#fdfbf7'; this.style.transform='scale(1.01)';" onmouseout="this.style.backgroundColor='white'; this.style.transform='scale(1)';">
                <i class="fas fa-file-upload" style="font-size: 2.5em; color: var(--primary-gold); margin-bottom: 12px;"></i>
                <br>
                <span id="file-name-label" style="color: #555; font-size: 1.1em; font-weight: 500;">คลิกเพื่อเลือกไฟล์ .joblib ของคุณ</span>
            </label>
            <input type="file" id="model-file" accept=".joblib" style="display: none;" required>
            
            <button type="submit" class="primary-btn" style="margin-top: 15px; width: 100%; font-size: 1.1em; padding: 12px;"><i class="fas fa-bolt" style="margin-right: 8px;"></i>อัปโหลดและใช้งานทันที</button>
        </form>
        <p id="upload-status" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
    </div>
</div>

<script>
    // อัปเดตชื่อไฟล์เมื่อมีการเลือกไฟล์
    const fileInput = document.getElementById('model-file');
    const fileNameLabel = document.getElementById('file-name-label');

    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            fileNameLabel.innerHTML = `<i class="fas fa-file-code" style="color: var(--primary-gold); margin-right: 5px;"></i> เลือกไฟล์แล้ว: <span style="color: #333;">${this.files[0].name}</span>`;
            document.querySelector('label[for="model-file"]').style.borderStyle = 'solid';
        } else {
            fileNameLabel.innerHTML = 'คลิกเพื่อเลือกไฟล์ .joblib ของคุณ';
            document.querySelector('label[for="model-file"]').style.borderStyle = 'dashed';
        }
    });

    // ฟังก์ชันแปลงข้อมูลโมเดลให้เป็น HTML และแสดงผล
    function renderModelInfo(data) {
        const infoDiv = document.getElementById('model-info-content');
        if (!data) {
            infoDiv.innerHTML = `<p style="color: #dc3545;"><i class="fas fa-exclamation-triangle"></i> ไม่สามารถดึงข้อมูลโมเดลได้</p>`;
            return;
        }
        infoDiv.innerHTML = `
            <p><i class="fas fa-table" style="color: var(--text-muted); width: 20px;"></i> <strong>จำนวนฟีเจอร์ (Input Features):</strong> ${data.features} <span style="font-size: 0.9em; color: gray;">(มาจากภาพ 8x8 = 64 พิกเซล)</span></p>
            <p><i class="fas fa-tags" style="color: var(--text-muted); width: 20px;"></i> <strong>ตัวเลขที่รองรับ (Target Classes):</strong> ${Array.isArray(data.classes) ? data.classes.join(', ') : data.classes}</p>
            <hr style="border: 0; height: 1px; background: #eee; margin: 15px 0;">
            <p><i class="fas fa-brain" style="color: var(--primary-gold); width: 20px;"></i> <strong>ชนิดอัลกอริทึม (Algorithm):</strong> <span style="color: ${data.algorithm === 'ไม่มีข้อมูล' ? 'var(--text-muted)' : '#333'}; font-weight: bold;">${data.algorithm}</span></p>
            <p><i class="fas fa-bullseye" style="color: var(--primary-gold); width: 20px;"></i> <strong>ความแม่นยำ (Accuracy):</strong> <span style="color: ${data.accuracy === 'ไม่มีข้อมูล' ? 'var(--text-muted)' : '#198754'}; font-weight: bold;">${data.accuracy}</span></p>
            <p><i class="fas fa-users" style="color: var(--primary-gold); width: 20px;"></i> <strong>จำนวนข้อมูลที่ใช้สอน (Training Samples):</strong> <span style="color: ${data.training_samples === 'ไม่มีข้อมูล' ? 'var(--text-muted)' : '#333'};">${data.training_samples}</span></p>
            <p><i class="fas fa-calendar-alt" style="color: var(--primary-gold); width: 20px;"></i> <strong>วันที่เทรน (Training Date):</strong> <span style="color: ${data.training_date === 'ไม่มีข้อมูล' ? 'var(--text-muted)' : '#333'};">${data.training_date}</span></p>
        `;
    }

    // ฟังก์ชันดึงข้อมูลโมเดลจาก Backend
    async function fetchModelInfo() {
        try {
            // ใส่ cache: 'no-store' เพื่อป้องกันเว็บบราวเซอร์จำค่าเก่า (Caching)
            const response = await fetch('/api/model-info', { cache: 'no-store' });
            const result = await response.json();
            
            if (result.status === 'success') {
                renderModelInfo(result.data);
            } else {
                renderModelInfo(null);
            }
        } catch (error) {
            renderModelInfo(null);
        }
    }

    // โหลดข้อมูลทันทีเมื่อเปิดหน้าเว็บ
    window.onload = fetchModelInfo;

    // จัดการตอนกดส่งฟอร์ม (Submit)
    document.getElementById('upload-form').addEventListener('submit', async function(e) {
        e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรช
        
        const statusText = document.getElementById('upload-status');
        const submitBtn = this.querySelector('button');
        
        if (fileInput.files.length === 0) {
            statusText.innerHTML = '<i class="fas fa-exclamation-circle"></i> กรุณาเลือกไฟล์ก่อนดำเนินการ';
            statusText.style.color = "#dc3545";
            return;
        }

        // เตรียมข้อมูลไฟล์เพื่อส่งไปหลังบ้าน
        const formData = new FormData();
        formData.append('model_file', fileInput.files[0]);

        statusText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังอัปโหลด... กรุณารอสักครู่';
        statusText.style.color = "#0d6efd";
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';

        try {
            const response = await fetch('/api/upload-model', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                statusText.innerHTML = '<i class="fas fa-check-circle"></i> ' + result.message;
                statusText.style.color = "#198754";

                // เคลียร์ช่องเลือกไฟล์ให้กลับเป็นสภาพเดิม
                fileInput.value = ""; 
                fileNameLabel.innerHTML = 'คลิกเพื่อเลือกไฟล์ .joblib ของคุณ';
                document.querySelector('label[for="model-file"]').style.borderStyle = 'dashed';

                // ถ้าฝั่งเซิร์ฟเวอร์ส่งข้อมูลโมเดลกลับมาพร้อมกัน ให้ใช้ข้อมูลนั้นอัปเดต UI ทันที
                if (result.data) {
                    renderModelInfo(result.data);
                } else {
                    // ถ้าไม่มี ให้ดึงข้อมูลจาก API อีกครั้ง (fallback)
                    fetchModelInfo();
                }
            } else {
                statusText.innerHTML = '<i class="fas fa-times-circle"></i> เกิดข้อผิดพลาด: ' + result.message;
                statusText.style.color = "#dc3545";
            }
        } catch (error) {
            statusText.innerHTML = '<i class="fas fa-wifi"></i> เกิดข้อผิดพลาดในการเชื่อมต่อ';
            statusText.style.color = "#dc3545";
        } finally {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    });
</script>
{% endblock %}
